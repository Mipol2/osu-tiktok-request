[project]
name = "osu-tiktok-request"
version = "1.0.0"
description = "osu! beatmap requests from TikTok Live chat via IndoFinity"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "websockets>=13,<16"]

[project.scripts]
osu-tiktok-request = "osureq.__main__:main"

[tool.setuptools]
packages = ["osureq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
